<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(180deg, #020b18 0%, #053a5f 60%, #0a6fa8 100%); min-height: 100vh; color: white; font-family: 'Nunito', sans-serif; text-align: center; padding: 36px 16px 60px; position: relative; overflow-x: hidden; }
    .bubble { position: fixed; bottom: -60px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(168,228,255,0.5), rgba(10,111,168,0.1)); border: 1px solid rgba(168,228,255,0.25); animation: riseUp linear infinite; pointer-events: none; z-index: 0; }
    @keyframes riseUp { 0%{transform:translateX(0) translateY(0);opacity:0.7} 100%{transform:translateX(15px) translateY(-110vh);opacity:0} }
    .content { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; }
    h1 { font-family: 'Bangers', cursive; font-size: clamp(44px,10vw,72px); letter-spacing: 4px; color: #f0c040; text-shadow: 0 0 30px rgba(240,192,64,0.5), 0 4px 0 rgba(0,0,0,0.4); margin-bottom: 6px; }
    .live-badge { display:inline-flex;align-items:center;gap:7px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:rgba(168,228,255,0.7);margin-bottom:20px; }
    .live-dot { width:9px;height:9px;background:#4f4;border-radius:50%;animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .timer-bar { background:rgba(5,20,40,0.8);backdrop-filter:blur(8px);border-radius:16px;border:2px solid rgba(240,192,64,0.35);padding:16px 24px 14px;margin-bottom:22px;position:relative;overflow:hidden; }
    .timer-bar.running{border-color:rgba(107,203,119,0.5)}.timer-bar.paused{border-color:rgba(255,217,61,0.5)}.timer-bar.ended{border-color:rgba(255,107,107,0.6);animation:urgentPulse 0.7s infinite alternate}
    @keyframes urgentPulse{0%{box-shadow:0 0 10px rgba(255,107,107,0.2)}100%{box-shadow:0 0 28px rgba(255,107,107,0.6)}}
    .timer-label{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(168,228,255,0.5);margin-bottom:6px}
    .timer-clock{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(46px,13vw,72px);letter-spacing:3px;line-height:1;color:#f0c040;text-shadow:0 0 24px rgba(240,192,64,0.4);font-variant-numeric:tabular-nums}
    .timer-clock.running{color:#6bcb77;text-shadow:0 0 24px rgba(107,203,119,0.4)}.timer-clock.paused{color:#ffd93d;text-shadow:0 0 24px rgba(255,217,61,0.35)}.timer-clock.ended{color:#ff6b6b;text-shadow:0 0 24px rgba(255,107,107,0.5)}
    .timer-state{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(168,228,255,0.45);margin-top:5px}
    .state-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
    .dot-run{background:#6bcb77;animation:pulse 1s infinite}.dot-stop{background:#ffd93d}.dot-end{background:#ff6b6b;animation:pulse 0.6s infinite}
    .progress-wrap{margin-top:10px;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
    .progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#6bcb77,#a8e4ff);transition:width 1s linear}
    .podium{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
    .place{background:rgba(5,20,40,0.75);backdrop-filter:blur(8px);border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;transition:transform 0.3s,box-shadow 0.3s;border:2px solid transparent}
    .place.first{border-color:gold;box-shadow:0 0 20px rgba(255,215,0,0.25)}.place.second{border-color:silver;box-shadow:0 0 14px rgba(192,192,192,0.2)}.place.third{border-color:#cd7f32;box-shadow:0 0 14px rgba(205,127,50,0.2)}
    .place-left{display:flex;align-items:center;gap:14px}
    .medal{font-size:2em}
    .place-name{font-size:1.2em;font-weight:900;color:#a8e4ff;transition:color 0.3s,transform 0.3s}
    .place-score{font-size:1.8em;font-weight:900;color:#f0c040;min-width:50px;text-align:right}
    .place.pop .place-name{color:gold;transform:scale(1.1)}
    .all-teams{background:rgba(5,20,40,0.7);backdrop-filter:blur(8px);border-radius:16px;overflow:hidden;margin-bottom:24px;border:1px solid rgba(0,229,255,0.15)}
    .all-teams h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(168,228,255,0.6);padding:14px 20px 10px;border-bottom:1px solid rgba(255,255,255,0.07)}
    .team-row{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.05);transition:background 0.2s;font-size:1.05em;cursor:pointer}
    .team-row:last-child{border-bottom:none}.team-row:hover{background:rgba(0,229,255,0.05)}
    .row-left{display:flex;align-items:center;gap:10px}
    .row-rank{font-size:0.85em;color:rgba(168,228,255,0.4);width:22px;text-align:right}
    .row-name{font-weight:700;color:#c8e8f5}
    .row-score{font-weight:900;color:#f0c040;font-size:1.1em}
    .row-bar-wrap{flex:1;margin:0 14px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
    .row-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,#00aaff,#00e5ff);transition:width 0.6s ease}
    .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    /* roster modal */
    .rmodal-overlay{display:none;position:fixed;inset:0;background:rgba(2,11,24,0.88);backdrop-filter:blur(6px);z-index:50;align-items:center;justify-content:center}
    .rmodal-overlay.open{display:flex}
    .rmodal{background:linear-gradient(145deg,rgba(5,20,40,0.98),rgba(2,11,24,0.98));border:2px solid rgba(0,229,255,0.25);border-radius:20px;padding:28px 28px 22px;width:90%;max-width:360px;text-align:left;box-shadow:0 0 40px rgba(0,229,255,0.1),0 20px 60px rgba(0,0,0,0.5);max-height:80vh;overflow-y:auto}
    .rmodal h3{font-family:'Bangers',cursive;font-size:28px;letter-spacing:3px;margin-bottom:6px;text-align:center}
    .rmodal-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(168,228,255,0.4);text-align:center;margin-bottom:18px}
    .member-chip{background:rgba(5,30,55,0.8);border:1px solid rgba(0,229,255,0.2);border-radius:8px;padding:9px 14px;font-size:14px;font-weight:700;color:#a8e4ff;margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .member-chip.captain-chip{border-color:rgba(240,192,64,0.5);background:rgba(40,30,5,0.5)}
    .captain-badge{font-size:11px;font-weight:700;letter-spacing:1px;color:#f0c040;background:rgba(240,192,64,0.15);border:1px solid rgba(240,192,64,0.4);border-radius:5px;padding:2px 7px;white-space:nowrap;font-family:'Nunito',sans-serif}
    .no-members{font-size:13px;color:rgba(168,228,255,0.35);text-align:center;padding:12px 0}
    .rmodal-close{display:block;width:100%;margin-top:14px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:10px;border-radius:10px;border:1px solid rgba(168,228,255,0.2);background:transparent;color:rgba(168,228,255,0.6);cursor:pointer;letter-spacing:1px;transition:background 0.2s}
    .rmodal-close:hover{background:rgba(168,228,255,0.08)}

    /* active event strip */
    .event-strip { display:none; background:linear-gradient(135deg,rgba(255,165,0,0.12),rgba(255,100,0,0.08)); border:2px solid rgba(255,165,0,0.55); border-radius:14px; padding:14px 20px; margin-bottom:20px; text-align:center; animation:stripPulse 2s ease-in-out infinite; }
    .event-strip.visible{display:block}
    @keyframes stripPulse{0%,100%{box-shadow:0 0 20px rgba(255,165,0,0.2)}50%{box-shadow:0 0 40px rgba(255,165,0,0.45)}}
    .event-strip-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,169,77,0.65);margin-bottom:5px}
    .event-strip-name{font-family:'Bangers',cursive;font-size:clamp(20px,5vw,30px);letter-spacing:2px;color:#ffa94d;text-shadow:0 0 16px rgba(255,169,77,0.4)}
    .event-strip-pts{font-size:13px;color:rgba(240,192,64,0.7);margin-top:3px}
    .back-btn{font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;padding:12px 30px;border-radius:10px;border:1px solid rgba(0,229,255,0.3);cursor:pointer;background:rgba(5,20,40,0.7);color:#a8e4ff;letter-spacing:1px;transition:background 0.2s,border-color 0.2s}
    .back-btn:hover{background:rgba(0,229,255,0.1);border-color:rgba(0,229,255,0.6)}

    /* ══ NEW: SHOP ROTATION DISPLAY (read-only, no buy button) ══ */
    .shop-rotation-status{font-size:11px;color:rgba(168,228,255,0.35);text-align:center;padding:8px 20px 0;letter-spacing:0.5px}
    .shop-display-list{display:flex;flex-direction:column;gap:8px;padding:14px 20px}
    .shop-display-item{display:flex;align-items:center;gap:10px;background:rgba(2,11,24,0.5);border-radius:10px;border:1px solid rgba(255,255,255,0.07);padding:10px 12px;text-align:left}
    .shop-display-item.type-powerup{border-color:rgba(107,203,119,0.3)}
    .shop-display-item.type-sabotage{border-color:rgba(255,107,107,0.3)}
    .shop-display-item.type-defensive{border-color:rgba(204,93,232,0.3)}
    .sdi-emoji{font-size:22px;flex-shrink:0}
    .sdi-info{flex:1;min-width:0}
    .sdi-name{font-size:14px;font-weight:900;color:#a8e4ff}
    .sdi-desc{font-size:11px;color:rgba(168,228,255,0.4);margin-top:2px}
    .sdi-badge{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0}
    .type-powerup .sdi-badge{background:rgba(107,203,119,0.15);color:#6bcb77}
    .type-sabotage .sdi-badge{background:rgba(255,107,107,0.15);color:#ff6b6b}
    .type-defensive .sdi-badge{background:rgba(204,93,232,0.15);color:#cc5de8}
    .type-item .sdi-badge{background:rgba(77,150,255,0.15);color:#74c0fc}
    .sdi-price{display:flex;align-items:center;gap:5px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;color:#f0c040;white-space:nowrap;flex-shrink:0}
    .sdi-price-img{width:18px;height:18px;border-radius:50%;object-fit:contain}
    .shop-display-empty{font-size:13px;color:rgba(168,228,255,0.3);text-align:center;padding:14px 0}

    /* ══ NEW: TOP-OF-SCREEN POPUP NOTIFICATIONS FOR SHOP PURCHASES ══ */
    .notif-popup-stack {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 92%;
      max-width: 420px;
      align-items: center;
      pointer-events: none;
    }
    .notif-popup {
      width: 100%;
      background: linear-gradient(135deg, rgba(5,20,40,0.97), rgba(2,11,24,0.97));
      border: 2px solid rgba(107,203,119,0.6);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 26px rgba(107,203,119,0.4);
      transform: translateY(-140%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      pointer-events: all;
      animation: notifGlow 1.4s ease-in-out infinite;
    }
    .notif-popup.show { transform: translateY(0); opacity: 1; }
    .notif-popup.sabotage {
      border-color: rgba(255,107,107,0.7);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 26px rgba(255,107,107,0.45);
      animation-name: notifGlowSab;
    }
    @keyframes notifGlow {
      0%,100% { box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 26px rgba(107,203,119,0.35); }
      50% { box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 40px rgba(107,203,119,0.65); }
    }
    @keyframes notifGlowSab {
      0%,100% { box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 26px rgba(255,107,107,0.4); }
      50% { box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 42px rgba(255,107,107,0.7); }
    }
    .notif-popup .notif-emoji { font-size: 34px; flex-shrink: 0; line-height: 1; }
    .notif-popup .notif-body { flex: 1; text-align: left; min-width: 0; }
    .notif-popup .notif-label {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(168,228,255,0.6); margin-bottom: 2px; font-weight: 700;
    }
    .notif-popup.sabotage .notif-label { color: rgba(255,150,150,0.8); }
    .notif-popup .notif-name {
      font-family:'Bangers',cursive; font-size: 20px; letter-spacing: 1.5px;
      color: #a8e4ff; line-height:1.15; word-break: break-word;
    }
    .notif-popup.sabotage .notif-name { color: #ff8787; }
    .notif-popup .notif-sub { font-size: 11px; color: rgba(168,228,255,0.5); margin-top: 3px; }
    .notif-popup .notif-close {
      flex-shrink:0; width:26px;height:26px;border-radius:8px;
      border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06);
      color:rgba(255,255,255,0.65); cursor:pointer; font-size:13px;
      display:flex;align-items:center;justify-content:center;
    }
    .notif-popup .notif-close:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
<!-- TOP-OF-SCREEN POPUP NOTIFICATIONS (shop purchases: power-ups & sabotages) -->
<div class="notif-popup-stack" id="notifPopupStack"></div>

<div class="content">
  <h1>🏆 LEADERBOARD</h1>
  <div class="live-badge"><span class="live-dot"></span>Live Scores</div>
  <div class="timer-bar" id="timerBar">
    <div class="timer-label">⏱ Mako Swimathon Timer</div>
    <div class="timer-clock" id="timerClock">--:--:--</div>
    <div class="timer-state" id="timerState"><span class="state-dot dot-stop"></span> Waiting for admin</div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- Active Event Strip -->
  <div class="event-strip" id="eventStrip">
    <div class="event-strip-label">⚡ Challenge Active</div>
    <div class="event-strip-name" id="eventStripName">—</div>
    <div class="event-strip-pts" id="eventStripPts"></div>
  </div>

  <div class="podium">
    <div class="place first" id="place1"><div class="place-left"><span class="medal">🥇</span><span class="place-name" id="name1">—</span></div><span class="place-score" id="score1">—</span></div>
    <div class="place second" id="place2"><div class="place-left"><span class="medal">🥈</span><span class="place-name" id="name2">—</span></div><span class="place-score" id="score2">—</span></div>
    <div class="place third" id="place3"><div class="place-left"><span class="medal">🥉</span><span class="place-name" id="name3">—</span></div><span class="place-score" id="score3">—</span></div>
  </div>
  <div class="all-teams">
    <h2>All Teams — tap a row to see members</h2>
    <div id="allTeamsRows"></div>
  </div>

  <!-- ══ NEW: MAKO SHOP — CURRENT ROTATION (read-only, no buy button) ══ -->
  <div class="all-teams" id="shopDisplayCard" style="display:none">
    <h2>🛒 Mako Shop — Currently Available</h2>
    <div class="shop-rotation-status" id="shopRotationStatus"></div>
    <div class="shop-display-list" id="shopDisplayList"></div>
  </div>

  <button class="back-btn" onclick="window.location.href='./index.html'">← Back</button>
</div>

<!-- Roster modal -->
<div class="rmodal-overlay" id="rosterModal">
  <div class="rmodal">
    <h3 id="rmodalTitle">Team</h3>
    <div class="rmodal-sub">Team Members</div>
    <div id="rmodalMembers"></div>
    <button class="rmodal-close" onclick="closeRosterModal()">Close</button>
  </div>
</div>

<script>
const TEAMS=['team1','team2','team3','team4','team5','team6','team7','team8','team9','team10','team11','team12'];
const COLORS={team1:'#ff6b6b',team2:'#ffd93d',team3:'#6bcb77',team4:'#4d96ff',team5:'#ff922b',team6:'#cc5de8',team7:'#20c997',team8:'#f06595',team9:'#74c0fc',team10:'#ff8787',team11:'#a9e34b',team12:'#ffa94d'};
const FB="https://counterapp-5297b-default-rtdb.firebaseio.com";
const MAKO_IMG='./assets/mako-coin.png';
let prevTop=['','',''];
let cachedRosters={};
let cachedNames={};

for(let i=0;i<18;i++){const b=document.createElement('div');b.className='bubble';const s=6+Math.random()*18;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*12}s`;document.body.appendChild(b);}

function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=s%60;return`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}

async function refreshTimer(){
  try{
    const res=await fetch(FB+'/timer.json');const t=(await res.json())||{};
    const bar=document.getElementById('timerBar');const clock=document.getElementById('timerClock');const state=document.getElementById('timerState');const fill=document.getElementById('progressFill');
    let remaining=t.remaining||0;const total=t.total||1;
    if(t.state==='running'&&t.serverTime)remaining=Math.max(0,remaining-(Date.now()-t.serverTime)/1000);
    clock.textContent=fmtTime(remaining);clock.className='timer-clock';bar.className='timer-bar';state.innerHTML='';
    if(t.state==='running'&&remaining>0){clock.classList.add('running');bar.classList.add('running');state.innerHTML='<span class="state-dot dot-run"></span> Running';}
    else if(t.state==='paused'){clock.classList.add('paused');bar.classList.add('paused');state.innerHTML='<span class="state-dot dot-stop"></span> Paused';}
    else if((t.state==='running'&&remaining<=0)||t.state==='ended'){clock.classList.add('ended');bar.classList.add('ended');clock.textContent="0:00:00";state.innerHTML='<span class="state-dot dot-end"></span> Time\'s Up!';}
    else{state.innerHTML='<span class="state-dot dot-stop"></span> Waiting to start';}
    const pct=total>0?Math.min(100,((total-remaining)/total)*100):0;fill.style.width=pct+'%';
  }catch(e){}
}

function parseRoster(raw){
  if(!raw||!Array.isArray(raw))return[];
  return raw.map(m=>typeof m==='string'?{name:m,captain:false}:{name:m.name||'',captain:!!m.captain});
}

async function load(){
  try{
    const [scoreRes,namesRes,rosterRes]=await Promise.all([
      fetch(FB+'/teams.json'),fetch(FB+'/teamNames.json'),fetch(FB+'/rosters.json')
    ]);
    const data=await scoreRes.json()||{};
    cachedNames=await namesRes.json()||{};
    const rawRosters=await rosterRes.json()||{};
    TEAMS.forEach(k=>{cachedRosters[k]=parseRoster(rawRosters[k]);});
    const sorted=TEAMS.map(k=>({key:k,name:cachedNames[k]||'Team '+k.replace('team',''),score:data[k]||0})).sort((a,b)=>b.score-a.score);
    const maxScore=sorted[0]?.score||1;
    [0,1,2].forEach(i=>{
      const entry=sorted[i];
      const nameEl=document.getElementById('name'+(i+1));const scoreEl=document.getElementById('score'+(i+1));const placeEl=document.getElementById('place'+(i+1));
      if(prevTop[i]&&prevTop[i]!==entry.key){placeEl.classList.add('pop');setTimeout(()=>placeEl.classList.remove('pop'),600);}
      nameEl.textContent=entry.name;scoreEl.innerText=entry.score;prevTop[i]=entry.key;
    });
    const container=document.getElementById('allTeamsRows');
    container.innerHTML=sorted.map((entry,i)=>`
      <div class="team-row" onclick="showRoster('${entry.key}')">
        <div class="row-left">
          <span class="row-rank">${i+1}</span>
          <span class="dot" style="background:${COLORS[entry.key]}"></span>
          <span class="row-name">${entry.name}</span>
        </div>
        <div class="row-bar-wrap"><div class="row-bar" style="width:${maxScore>0?(entry.score/maxScore*100):0}%;background:linear-gradient(90deg,${COLORS[entry.key]},${COLORS[entry.key]}aa)"></div></div>
        <span class="row-score">${entry.score}</span>
      </div>`).join('');
  }catch(e){}
}

function showRoster(team){
  const name=cachedNames[team]||'Team '+team.replace('team','');
  const members=cachedRosters[team]||[];
  document.getElementById('rmodalTitle').textContent=name;
  const membersEl=document.getElementById('rmodalMembers');
  if(members.length===0){
    membersEl.innerHTML='<div class="no-members">No members listed yet</div>';
  } else {
    membersEl.innerHTML=members.map(m=>{
      const isCap=m.captain;
      return`<div class="member-chip${isCap?' captain-chip':''}">
        <span style="flex:1">👤 ${m.name}</span>
        ${isCap?'<span class="captain-badge">★ Captain</span>':''}
      </div>`;
    }).join('');
  }
  document.getElementById('rosterModal').classList.add('open');
}
function closeRosterModal(){document.getElementById('rosterModal').classList.remove('open');}
document.getElementById('rosterModal').addEventListener('click',function(e){if(e.target===this)closeRosterModal();});

load();refreshTimer();setInterval(load,500);setInterval(refreshTimer,1000);

async function pollActiveEvent(){
  try{
    const res=await fetch(FB+'/activeEvent.json');const ev=(await res.json())||{};
    const strip=document.getElementById('eventStrip');
    const now=Date.now();
    const expired=ev.expiresAt&&now>ev.expiresAt;
    if(ev&&ev.active&&ev.name&&!expired){
      document.getElementById('eventStripName').textContent=ev.name;
      let ptsText=`+${ev.points||1} pt${(ev.points||1)!==1?'s':''} for completing!`;
      if(ev.expiresAt){const secsLeft=Math.max(0,Math.round((ev.expiresAt-now)/1000));const m=Math.floor(secsLeft/60);const s=secsLeft%60;ptsText+=` · ⏱ ${m}:${String(s).padStart(2,'0')} left`;}
      document.getElementById('eventStripPts').textContent=ptsText;
      strip.classList.add('visible');
    }else{strip.classList.remove('visible');}
  }catch(e){}
}
setInterval(pollActiveEvent,1000);pollActiveEvent();

/* ══════════════════════════════════════
   NEW: MAKO SHOP — CURRENT ROTATION DISPLAY
   Read-only view of whatever the shop currently has available (respects
   the admin's enabled/rotation settings exactly like the team pages do),
   but with no buy button — this is just a shared/public view. Refreshes
   on the same 1-second cadence as the other live boards on this page.
══════════════════════════════════════ */
async function loadShopDisplay(){
  try{
    const [itemsRes,settingsRes,rotationRes]=await Promise.all([
      fetch(FB+'/shopItems.json'),fetch(FB+'/shopSettings.json'),fetch(FB+'/shopRotation.json')
    ]);
    const itemsData=(await itemsRes.json())||{};
    const settingsData=(await settingsRes.json())||{};
    const rotationData=(await rotationRes.json())||{};
    const enabled=settingsData.enabled!==false;
    const card=document.getElementById('shopDisplayCard');
    const list=document.getElementById('shopDisplayList');
    const statusEl=document.getElementById('shopRotationStatus');

    if(!enabled){card.style.display='none';return;}
    card.style.display='block';

    const rotationEnabled=!!settingsData.rotationEnabled;
    const rotationItemIds=(rotationEnabled&&Array.isArray(rotationData.itemIds))?rotationData.itemIds:null;

    let allItems=Object.entries(itemsData)
      .map(([id,v])=>({id,...v}))
      .filter(i=>i.enabled!==false)
      .sort((a,b)=>(a.sortOrder||99)-(b.sortOrder||99)||(a.name||'').localeCompare(b.name||''));

    const shownItems=(rotationEnabled&&rotationItemIds)?allItems.filter(i=>rotationItemIds.includes(i.id)):allItems;

    if(shownItems.length===0){
      list.innerHTML='<div class="shop-display-empty">No items available right now</div>';
    } else {
      list.innerHTML=shownItems.map(item=>{
        const typeClass='type-'+(item.type||'item');
        const badge=item.type==='powerup'?'⚡ POWER-UP':item.type==='sabotage'?'💀 SABOTAGE':item.type==='defensive'?'🛡️ DEFENSIVE':'🛒 ITEM';
        return `<div class="shop-display-item ${typeClass}">
          <div class="sdi-emoji">${item.emoji||'🛒'}</div>
          <div class="sdi-info">
            <div class="sdi-name">${item.name}</div>
            ${item.description?`<div class="sdi-desc">${item.description}</div>`:''}
          </div>
          <div class="sdi-badge">${badge}</div>
          <div class="sdi-price"><img class="sdi-price-img" src="${MAKO_IMG}" alt="Mako">${item.price||0}</div>
        </div>`;
      }).join('');
    }

    if(rotationEnabled&&rotationData.nextRotationAt){
      const remaining=Math.max(0,Math.round((rotationData.nextRotationAt-Date.now())/1000));
      const m=Math.floor(remaining/60);const s=remaining%60;
      statusEl.textContent=`🔄 Next rotation in ${m}:${String(s).padStart(2,'0')} · showing ${shownItems.length} item${shownItems.length!==1?'s':''}`;
    } else if(rotationEnabled){
      statusEl.textContent='🔄 Rotation on — starting soon';
    } else {
      statusEl.textContent='';
    }
  }catch(e){}
}
loadShopDisplay();setInterval(loadShopDisplay,1000);

/* ══════════════════════════════════════
   NEW: TOP-OF-SCREEN POPUP NOTIFICATIONS FOR SHOP PURCHASES
   Watches /shopPurchases for new power-up or sabotage buys and pops a
   banner at the top of the screen saying who bought it, and — for
   sabotages — who they targeted. Purchases that existed before this page
   was opened are marked "seen" silently on first load so it doesn't spam
   the whole purchase history the moment the board is opened; only NEW
   purchases from then on trigger a popup. Refreshes on the same 1-second
   cadence as the rest of this page's live data.
══════════════════════════════════════ */
let seenPurchaseKeys=new Set(JSON.parse(sessionStorage.getItem('seenShopPurchases_leaderboard')||'[]'));
let shopPurchasesFirstLoad=true;

function spawnPurchaseNotif(p){
  const stack=document.getElementById('notifPopupStack');
  if(!stack)return;
  const isSab=p.itemType==='sabotage';
  const buyerName=cachedNames[p.team]||p.team;
  let nameHTML,subHTML;
  if(isSab&&p.targetTeam){
    const targetName=cachedNames[p.targetTeam]||p.targetTeam;
    nameHTML=`${buyerName} ➜ ${targetName}`;
    subHTML=p.itemName||'';
  } else {
    nameHTML=buyerName;
    subHTML=p.itemName||'';
  }
  const el=document.createElement('div');
  el.className='notif-popup'+(isSab?' sabotage':'');
  el.innerHTML=`<div class="notif-emoji">${p.itemEmoji||(isSab?'💀':'⚡')}</div>
    <div class="notif-body">
      <div class="notif-label">${isSab?'💀 Sabotage Bought':'⚡ Power-Up Bought'}</div>
      <div class="notif-name">${nameHTML}</div>
      <div class="notif-sub">${subHTML}</div>
    </div>
    <button class="notif-close" onclick="this.parentElement.remove()">✕</button>`;
  stack.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  const life=isSab?7000:5500;
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>el.remove(),400);
  },life);
}

async function pollShopPurchases(){
  try{
    const res=await fetch(FB+'/shopPurchases.json');
    const data=(await res.json())||{};
    const entries=Object.entries(data).map(([key,p])=>({key,...p})).sort((a,b)=>(a.time||0)-(b.time||0));
    entries.forEach(p=>{
      if(seenPurchaseKeys.has(p.key))return;
      seenPurchaseKeys.add(p.key);
      if(!shopPurchasesFirstLoad&&(p.itemType==='powerup'||p.itemType==='sabotage')){
        spawnPurchaseNotif(p);
      }
    });
    shopPurchasesFirstLoad=false;
    sessionStorage.setItem('seenShopPurchases_leaderboard',JSON.stringify([...seenPurchaseKeys]));
  }catch(e){}
}
pollShopPurchases();setInterval(pollShopPurchases,1000);
</script>
