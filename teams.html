<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #020b18 0%, #053a5f 60%, #0a6fa8 100%);
      min-height: 100vh; color: white; font-family: 'Nunito', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 40px 20px; gap: 16px;
    }
    .team-name { font-family: 'Bangers', cursive; font-size: clamp(40px,10vw,72px); letter-spacing: 4px; color: #a8e4ff; text-shadow: 0 0 30px rgba(0,229,255,0.5), 0 4px 0 rgba(0,0,0,0.4); text-align:center; }
    .score { font-family: 'Bangers', cursive; font-size: clamp(80px,22vw,140px); letter-spacing: 2px; color: #f0c040; text-shadow: 0 0 40px rgba(240,192,64,0.5), 0 4px 0 rgba(0,0,0,0.4); line-height: 1; }
    .point-btn { font-family: 'Bangers', cursive; font-size: 32px; letter-spacing: 3px; padding: 18px 60px; border-radius: 16px; border: 2px solid var(--tc, #00e5ff); background: rgba(5,20,40,0.8); color: white; cursor: pointer; box-shadow: 0 0 20px color-mix(in srgb, var(--tc, #00e5ff) 40%, transparent); transition: transform 0.1s, box-shadow 0.2s; position: relative; overflow: hidden; }
    .point-btn::before { content:""; position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transform:skewX(-20deg);animation:shine 2s linear infinite; }
    @keyframes shine{0%{left:-120%}100%{left:160%}}
    .point-btn:hover{transform:scale(1.05)}.point-btn:active{transform:scale(0.96)}

    /* CURRENCY HUD */
    .currency-hud{
      position:fixed;top:14px;right:14px;z-index:50;
      display:flex;flex-direction:column;gap:6px;align-items:flex-end;
    }
    .coin-badge{
      display:flex;align-items:center;gap:7px;
      background:rgba(2,11,24,0.85);
      backdrop-filter:blur(8px);
      border-radius:28px;
      padding:5px 16px 5px 5px;
      border:1.5px solid rgba(255,255,255,0.1);
      font-family:'Bangers',cursive;
      font-size:24px;
      letter-spacing:1px;
      transition:transform 0.15s;
      box-shadow:0 2px 14px rgba(0,0,0,0.4);
      min-width:100px;
    }
    .coin-badge.gold{border-color:rgba(240,192,64,0.4);color:#f0c040;text-shadow:0 0 10px rgba(240,192,64,0.5)}
    .coin-badge.mako{border-color:rgba(77,150,255,0.4);color:#74c0fc;text-shadow:0 0 10px rgba(77,150,255,0.5)}
    .coin-badge.bump{animation:coinBump 0.4s ease}
    @keyframes coinBump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
    .coin-icon{font-size:16px;line-height:1}
    .coin-icon-img{width:48px;height:48px;object-fit:contain;border-radius:50%;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6))}

    /* CHALLENGE BANNER */
    .challenge-banner { display:none; position:relative; width:100%; max-width:420px; background:linear-gradient(135deg,rgba(255,165,0,0.12),rgba(255,100,0,0.08)); border:2px solid rgba(255,165,0,0.6); border-radius:20px; padding:20px 22px; text-align:center; box-shadow:0 0 30px rgba(255,165,0,0.25); animation:bannerPulse 2s ease-in-out infinite; }
    .challenge-banner.visible{display:block}
    @keyframes bannerPulse{0%,100%{box-shadow:0 0 30px rgba(255,165,0,0.25)}50%{box-shadow:0 0 50px rgba(255,165,0,0.5)}}
    .challenge-badge{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,169,77,0.7);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .badge-dot{width:8px;height:8px;border-radius:50%;background:#ffa94d;animation:badgeBlink 0.8s infinite}
    @keyframes badgeBlink{0%,100%{opacity:1}50%{opacity:0.2}}
    .challenge-name{font-family:'Bangers',cursive;font-size:clamp(24px,6vw,36px);letter-spacing:2px;color:#ffa94d;text-shadow:0 0 20px rgba(255,169,77,0.5);margin-bottom:6px;line-height:1.2}
    .challenge-pts{font-size:14px;font-weight:700;color:rgba(240,192,64,0.8);margin-bottom:18px;letter-spacing:1px}
    .complete-btn{font-family:'Bangers',cursive;font-size:26px;letter-spacing:3px;padding:16px 40px;border-radius:14px;border:2px solid #6bcb77;background:rgba(5,20,40,0.85);color:white;cursor:pointer;box-shadow:0 0 20px rgba(107,203,119,0.4);transition:transform 0.12s,box-shadow 0.2s;position:relative;overflow:hidden;width:100%}
    .complete-btn::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(107,203,119,0.6),transparent);transform:skewX(-20deg);animation:shine 1.8s linear infinite}
    .complete-btn span{position:relative;z-index:2}
    .complete-btn:hover{transform:scale(1.03);box-shadow:0 0 36px rgba(107,203,119,0.7)}.complete-btn:active{transform:scale(0.96)}.complete-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
    .done-flash{display:none;font-family:'Bangers',cursive;font-size:28px;letter-spacing:3px;color:#6bcb77;text-shadow:0 0 20px rgba(107,203,119,0.6);text-align:center;animation:flashIn 0.4s ease}
    .done-flash.show{display:block}
    @keyframes flashIn{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}

    /* ROSTER */
    .roster-card{background:rgba(5,20,40,0.75);backdrop-filter:blur(8px);border-radius:14px;border:1px solid rgba(0,229,255,0.15);padding:16px 22px;width:100%;max-width:340px}
    .roster-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(168,228,255,0.5);margin-bottom:10px}
    .member-chip{font-size:14px;font-weight:700;color:#a8e4ff;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:8px}
    .member-chip:last-child{border-bottom:none}
    .captain-badge{font-size:11px;font-weight:700;letter-spacing:1px;color:#f0c040;background:rgba(240,192,64,0.15);border:1px solid rgba(240,192,64,0.4);border-radius:5px;padding:2px 7px;white-space:nowrap}
    .member-chip.captain-chip{color:#f0c040}
    .no-members{font-size:13px;color:rgba(168,228,255,0.3)}
    .back-btn{font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;padding:10px 24px;border-radius:10px;border:1px solid rgba(0,229,255,0.3);cursor:pointer;background:rgba(5,20,40,0.6);color:#a8e4ff;letter-spacing:1px;transition:background 0.2s}
    .back-btn:hover{background:rgba(0,229,255,0.1)}

    /* ══ WHEEL SECTION ══ */
    .wheel-section{width:100%;max-width:400px;display:none;flex-direction:column;align-items:center;gap:0}
    .wheel-section.visible{display:flex}
    .wheel-section-title{font-family:'Bangers',cursive;font-size:22px;letter-spacing:3px;color:#cc5de8;text-shadow:0 0 16px rgba(204,93,232,0.5);margin-bottom:12px;text-align:center}
    .wheel-wrap{position:relative;width:280px;height:280px;flex-shrink:0}
    @media(max-width:360px){.wheel-wrap{width:240px;height:240px}}
    .wheel-canvas{display:block;border-radius:50%;will-change:transform}
    .wheel-pointer{position:absolute;top:50%;right:-18px;transform:translateY(-50%);width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-right:26px solid #fff;filter:drop-shadow(0 0 6px rgba(255,255,255,0.7));z-index:10}
    .spin-btn{font-family:'Bangers',cursive;font-size:28px;letter-spacing:3px;padding:16px 44px;border-radius:16px;border:2px solid #cc5de8;background:rgba(5,20,40,0.85);color:white;cursor:pointer;box-shadow:0 0 22px rgba(204,93,232,0.4);transition:transform 0.12s,box-shadow 0.2s;position:relative;overflow:hidden;margin-top:16px;width:100%}
    .spin-btn::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(204,93,232,0.7),transparent);transform:skewX(-20deg);animation:shine 2.2s linear infinite}
    .spin-btn span{position:relative;z-index:2}
    .spin-btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 0 38px rgba(204,93,232,0.7)}
    .spin-btn:active:not(:disabled){transform:scale(0.96)}
    .spin-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
    .spin-btn.ready{animation:spinBtnPulse 2s ease-in-out infinite}
    @keyframes spinBtnPulse{0%,100%{box-shadow:0 0 22px rgba(204,93,232,0.4)}50%{box-shadow:0 0 44px rgba(204,93,232,0.8)}}
    .wheel-cooldown-msg{font-size:13px;color:rgba(168,228,255,0.5);letter-spacing:1px;margin-top:8px;text-align:center;height:18px}
    .wheel-result-overlay{
      position:fixed;inset:0;
      background:rgba(2,11,24,0.92);
      backdrop-filter:blur(4px);
      z-index:200;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      opacity:0;pointer-events:none;
      transition:opacity 0.35s ease;
    }
    .wheel-result-overlay.show{opacity:1;pointer-events:all}
    .result-badge{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(204,93,232,0.7);animation:badgeBlink 1s infinite}
    .result-name{font-family:'Bangers',cursive;font-size:clamp(36px,10vw,64px);letter-spacing:4px;text-align:center;line-height:1.1;padding:0 20px}
    .result-pts{font-family:'Bangers',cursive;font-size:clamp(28px,8vw,48px);color:#f0c040;text-shadow:0 0 24px rgba(240,192,64,0.6);letter-spacing:2px}
    .result-dismiss{font-family:'Bangers',cursive;font-size:22px;letter-spacing:2px;padding:14px 40px;border-radius:14px;border:2px solid #cc5de8;background:rgba(5,20,40,0.9);color:white;cursor:pointer;margin-top:8px;transition:transform 0.12s,box-shadow 0.2s;box-shadow:0 0 16px rgba(204,93,232,0.4)}
    .result-dismiss:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(204,93,232,0.7)}
    #confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:201}

    /* ══ SHOP SECTION ══ */
    .shop-section {
      width: 100%;
      max-width: 480px;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }
    .shop-section.visible { display: flex; }

    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .shop-title {
      font-family: 'Bangers', cursive;
      font-size: 26px;
      letter-spacing: 3px;
      color: #4d96ff;
      text-shadow: 0 0 16px rgba(77,150,255,0.55);
    }
    .shop-balance {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(2,11,24,0.8);
      border: 1.5px solid rgba(77,150,255,0.3);
      border-radius: 20px;
      padding: 4px 14px 4px 6px;
      font-family: 'Bangers', cursive;
      font-size: 20px;
      color: #74c0fc;
    }
    .shop-balance-img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: contain;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media(max-width: 380px) { .shop-grid { grid-template-columns: 1fr; } }

    .shop-item {
      background: rgba(5,20,40,0.8);
      border: 1.5px solid rgba(77,150,255,0.2);
      border-radius: 16px;
      padding: 16px 14px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .shop-item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(77,150,255,0.06), transparent);
      pointer-events: none;
    }
    .shop-item.powerup { border-color: rgba(107,203,119,0.3); }
    .shop-item.powerup::before { background: linear-gradient(135deg, rgba(107,203,119,0.08), transparent); }
    .shop-item.sabotage { border-color: rgba(255,107,107,0.3); }
    .shop-item.sabotage::before { background: linear-gradient(135deg, rgba(255,107,107,0.08), transparent); }

    .shop-item:hover:not(.cant-afford):not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 24px rgba(77,150,255,0.35);
    }
    .shop-item.powerup:hover:not(.cant-afford) { box-shadow: 0 0 24px rgba(107,203,119,0.4); border-color: rgba(107,203,119,0.7); }
    .shop-item.sabotage:hover:not(.cant-afford) { box-shadow: 0 0 24px rgba(255,107,107,0.4); border-color: rgba(255,107,107,0.7); }
    .shop-item.cant-afford { opacity: 0.45; cursor: not-allowed; transform: none !important; }

    .shop-item-emoji { font-size: 32px; line-height: 1; }
    .shop-item-name {
      font-family: 'Bangers', cursive;
      font-size: 17px;
      letter-spacing: 1.5px;
      color: #a8e4ff;
      line-height: 1.2;
    }
    .shop-item-desc {
      font-size: 11px;
      color: rgba(168,228,255,0.5);
      line-height: 1.4;
      letter-spacing: 0.5px;
    }
    .shop-item-type-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .shop-item.powerup .shop-item-type-badge { background: rgba(107,203,119,0.15); color: #6bcb77; border: 1px solid rgba(107,203,119,0.35); }
    .shop-item.sabotage .shop-item-type-badge { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.35); }
    .shop-item-default .shop-item-type-badge { background: rgba(77,150,255,0.15); color: #74c0fc; border: 1px solid rgba(77,150,255,0.35); }

    .shop-item-price {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: #74c0fc;
      margin-top: 2px;
    }
    .shop-price-img { width: 22px; height: 22px; border-radius: 50%; object-fit: contain; }
    .shop-buy-btn {
      font-family: 'Bangers', cursive;
      font-size: 16px;
      letter-spacing: 2px;
      padding: 8px 0;
      width: 100%;
      border-radius: 10px;
      border: 1.5px solid rgba(77,150,255,0.5);
      background: rgba(2,11,24,0.8);
      color: white;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .shop-item.powerup .shop-buy-btn { border-color: rgba(107,203,119,0.5); }
    .shop-item.powerup .shop-buy-btn:hover { background: rgba(107,203,119,0.15); box-shadow: 0 0 12px rgba(107,203,119,0.4); }
    .shop-item.sabotage .shop-buy-btn { border-color: rgba(255,107,107,0.5); }
    .shop-item.sabotage .shop-buy-btn:hover { background: rgba(255,107,107,0.15); box-shadow: 0 0 12px rgba(255,107,107,0.4); }
    .shop-buy-btn:hover { background: rgba(77,150,255,0.15); box-shadow: 0 0 12px rgba(77,150,255,0.3); }
    .shop-buy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .shop-buy-btn span { position: relative; z-index: 2; }

    .shop-empty {
      font-size: 13px;
      color: rgba(168,228,255,0.3);
      text-align: center;
      padding: 20px 0;
      letter-spacing: 1px;
    }

    /* Purchase confirm modal */
    .shop-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2,11,24,0.88);
      backdrop-filter: blur(6px);
      z-index: 150;
      align-items: center;
      justify-content: center;
    }
    .shop-modal-overlay.open { display: flex; }
    .shop-modal {
      background: linear-gradient(145deg, rgba(5,20,40,0.98), rgba(2,11,24,0.98));
      border: 2px solid rgba(77,150,255,0.35);
      border-radius: 22px;
      padding: 32px 28px 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 0 40px rgba(77,150,255,0.2), 0 20px 60px rgba(0,0,0,0.5);
    }
    .shop-modal.powerup { border-color: rgba(107,203,119,0.45); box-shadow: 0 0 40px rgba(107,203,119,0.2), 0 20px 60px rgba(0,0,0,0.5); }
    .shop-modal.sabotage { border-color: rgba(255,107,107,0.45); box-shadow: 0 0 40px rgba(255,107,107,0.2), 0 20px 60px rgba(0,0,0,0.5); }
    .shop-modal-emoji { font-size: 52px; line-height: 1; margin-bottom: 10px; }
    .shop-modal-name {
      font-family: 'Bangers', cursive;
      font-size: 32px;
      letter-spacing: 3px;
      color: #a8e4ff;
      margin-bottom: 6px;
    }
    .shop-modal-desc {
      font-size: 13px;
      color: rgba(168,228,255,0.55);
      margin-bottom: 18px;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }
    .shop-modal-cost {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Bangers', cursive;
      font-size: 28px;
      color: #74c0fc;
      background: rgba(2,11,24,0.7);
      border: 1.5px solid rgba(77,150,255,0.25);
      border-radius: 14px;
      padding: 6px 20px;
      margin-bottom: 22px;
    }
    .shop-modal-cost-img { width: 28px; height: 28px; border-radius: 50%; object-fit: contain; }
    .shop-modal-btns { display: flex; gap: 10px; }
    .shop-modal-confirm {
      flex: 1;
      font-family: 'Bangers', cursive;
      font-size: 22px;
      letter-spacing: 2px;
      padding: 13px;
      border-radius: 12px;
      border: 2px solid #74c0fc;
      background: rgba(2,11,24,0.85);
      color: white;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s;
      box-shadow: 0 0 14px rgba(77,150,255,0.3);
    }
    .shop-modal.powerup .shop-modal-confirm { border-color: #6bcb77; box-shadow: 0 0 14px rgba(107,203,119,0.3); }
    .shop-modal.sabotage .shop-modal-confirm { border-color: #ff6b6b; box-shadow: 0 0 14px rgba(255,107,107,0.3); }
    .shop-modal-confirm:hover { transform: scale(1.04); box-shadow: 0 0 28px rgba(77,150,255,0.6); }
    .shop-modal-cancel {
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 13px 20px;
      border-radius: 12px;
      border: 1px solid rgba(168,228,255,0.2);
      background: transparent;
      color: rgba(168,228,255,0.5);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .shop-modal-cancel:hover { background: rgba(168,228,255,0.08); color: #a8e4ff; }

    /* Purchase success overlay */
    .purchase-success {
      position: fixed;
      inset: 0;
      background: rgba(2,11,24,0.9);
      backdrop-filter: blur(4px);
      z-index: 160;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .purchase-success.show { opacity: 1; pointer-events: all; }
    .purchase-success-emoji { font-size: 72px; animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
    @keyframes popIn { 0%{transform:scale(0.3);opacity:0} 100%{transform:scale(1);opacity:1} }
    .purchase-success-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(32px, 8vw, 52px);
      letter-spacing: 3px;
      color: #6bcb77;
      text-shadow: 0 0 30px rgba(107,203,119,0.6);
    }
    .purchase-success-name {
      font-family: 'Bangers', cursive;
      font-size: clamp(20px, 5vw, 30px);
      letter-spacing: 2px;
      color: #a8e4ff;
    }
    .purchase-success-cost {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: #74c0fc;
      opacity: 0.8;
    }
    .purchase-success-cost-img { width: 24px; height: 24px; border-radius: 50%; object-fit: contain; }
  </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>

<!-- CURRENCY HUD -->
<div class="currency-hud">
  <div class="coin-badge gold" id="goldBadge">
    <img class="coin-icon-img" src="./assets/gold-mako.png" id="goldCoinImg" alt="Gold Mako">
    <span id="goldCount">0</span>
  </div>
  <div class="coin-badge mako" id="makoBadge">
    <img class="coin-icon-img" src="./assets/mako-coin.png" id="makoCoinImg" alt="Mako Coin">
    <span id="makoCount">0</span>
  </div>
</div>

<div class="team-name" id="title">Loading...</div>
<div class="score" id="score">0</div>
<button class="point-btn" id="pointBtn" onclick="update()"><span>+2 LAPS</span></button>

<!-- CHALLENGE BANNER -->
<div class="challenge-banner" id="challengeBanner">

<script>
/* ─────────────── CONFIG ─────────────── */
const GOLD_IMG='./assets/gold-mako.png';
const MAKO_IMG='./assets/mako-coin.png';
const COLORS_TEAM={team1:'#ff6b6b',team2:'#ffd93d',team3:'#6bcb77',team4:'#4d96ff',team5:'#ff922b',team6:'#cc5de8',team7:'#20c997',team8:'#f06595',team9:'#74c0fc',team10:'#ff8787',team11:'#a9e34b',team12:'#ffa94d'};
const WHEEL_SEG_COLORS=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8','#20c997','#f06595','#74c0fc','#a9e34b','#ffa94d','#e64980','#339af0','#51cf66'];
const FB="https://counterapp-5297b-default-rtdb.firebaseio.com";
let team=localStorage.getItem("myTeam");
if(!team){window.location.href="index.html";}
const num=team.replace('team','');
document.getElementById("pointBtn").style.setProperty('--tc',COLORS_TEAM[team]||'#00e5ff');

const LOW_END = (navigator.hardwareConcurrency||4) <= 2;

/* ─────────────── STATE ─────────────── */
let lastEventId=null;
let completedEventIds=JSON.parse(sessionStorage.getItem('completedEvents')||'[]');
let wheelItems=[];
let wheelSettings={enabled:false,cooldownMinutes:10};
let lastSpinAt=0;
let timerEnded=false;
let offscreen=null;
let spinRAF=null;
let spinStartTime=0;
let spinDuration=4200;
let spinStartAngle=0;
let spinTotalRotation=0;
let spinTargetIdx=0;
let isSpinning=false;
let currentAngle=0;

/* ─────────────── SHOP STATE ─────────────── */
let shopItems=[];
let pendingPurchase=null;
let _makoBalance=0;

/* ─────────────── HELPERS ─────────────── */
function parseRoster(raw){
  if(!raw||!Array.isArray(raw))return[];
  return raw.map(m=>typeof m==='string'?{name:m,captain:false}:{name:m.name||'',captain:!!m.captain});
}

/* ─────────────── GAME ─────────────── */
async function loadInfo(){
  try{
    const [nameRes,rosterRes]=await Promise.all([fetch(FB+'/teamNames/'+team+'.json'),fetch(FB+'/rosters/'+team+'.json')]);
    const name=await nameRes.json();const rawRoster=await rosterRes.json();
    const roster=parseRoster(rawRoster);
    const displayName=(name&&name!=='null')?name:`Team ${num}`;
    document.getElementById("title").textContent=displayName;
    if(roster&&roster.length>0){
      document.getElementById('rosterCard').style.display='block';
      document.getElementById('memberList').innerHTML=roster.map(m=>{
        const isCap=m.captain;
        return`<div class="member-chip${isCap?' captain-chip':''}"><span>👤 ${m.name}</span>${isCap?'<span class="captain-badge">★ Captain</span>':''}</div>`;
      }).join('');
    }
  }catch(e){document.getElementById("title").textContent=`Team ${num}`;}
}

async function update(){
  if(timerEnded)return;
  let res=await fetch(FB+"/teams/"+team+".json");let value=await res.json();
  value=(value||0)+2;
  await fetch(FB+"/teams/"+team+".json",{method:"PUT",body:JSON.stringify(value)});
  document.getElementById("score").innerText=value;
}
async function loadScore(){
  const res=await fetch(FB+"/teams/"+team+".json");const value=await res.json();
  document.getElementById("score").innerText=value||0;
}

async function pollChallenge(){
  try{
    const res=await fetch(FB+'/activeEvent.json');const ev=(await res.json())||{};
    const banner=document.getElementById('challengeBanner');
    const now=Date.now();const expired=ev.expiresAt&&now>ev.expiresAt;
    if(ev&&ev.active&&ev.id&&!expired){
      const alreadyDone=completedEventIds.includes(ev.id+'_'+ev.firedAt);
      document.getElementById('challengeName').textContent=ev.name||'Challenge';
      document.getElementById('completeBtn').disabled=alreadyDone||timerEnded;
      document.getElementById('doneFlash').classList.toggle('show',alreadyDone);
      banner.classList.add('visible');
      lastEventId={id:ev.id,name:ev.name,points:ev.points||1,firedAt:ev.firedAt};
      if(ev.expiresAt){
        const secsLeft=Math.max(0,Math.round((ev.expiresAt-now)/1000));
        const m=Math.floor(secsLeft/60);const s=secsLeft%60;
        document.getElementById('challengePts').textContent=`+${ev.points||1} pt${(ev.points||1)!==1?'s':''} · ⏱ ${m}:${String(s).padStart(2,'0')} left`;
      } else {
        document.getElementById('challengePts').textContent=`+${ev.points||1} point${(ev.points||1)!==1?'s':''} for completing!`;
      }
    } else {
      banner.classList.remove('visible');lastEventId=null;
    }
  }catch(e){}
}

async function completeChallenge(){
  if(!lastEventId||timerEnded)return;
  const key=lastEventId.id+'_'+lastEventId.firedAt;
  if(completedEventIds.includes(key))return;
  document.getElementById('completeBtn').disabled=true;
  document.getElementById('doneFlash').classList.add('show');
  const res=await fetch(FB+"/teams/"+team+".json");let current=await res.json();current=(current||0)+lastEventId.points;
  await fetch(FB+"/teams/"+team+".json",{method:"PUT",body:JSON.stringify(current)});
  document.getElementById("score").innerText=current;
  const logEntry={team,eventName:lastEventId.name,points:lastEventId.points,time:Date.now()};
  await fetch(FB+'/completions/'+Date.now()+'_'+team+'.json',{method:'PUT',body:JSON.stringify(logEntry)});
  completedEventIds.push(key);
  sessionStorage.setItem('completedEvents',JSON.stringify(completedEventIds));
}

/* ─────────────── WHEEL ─────────────── */
async function loadWheel(){
  try{
    const [iRes,sRes,spinRes]=await Promise.all([
      fetch(FB+'/wheelItems.json'),
      fetch(FB+'/wheelSettings.json'),
      fetch(FB+'/wheelSpins/'+team+'.json')
    ]);
    const iData=(await iRes.json())||{};
    const sData=(await sRes.json())||{};
    const spinData=(await spinRes.json())||{};
    wheelSettings={enabled:!!sData.enabled,cooldownMinutes:sData.cooldownMinutes||10};
    wheelItems=Object.entries(iData).map(([id,v])=>({id,...v}));
    lastSpinAt=spinData.lastSpinAt||0;
    updateWheelVisibility();
    if(wheelItems.length>0){buildOffscreen();drawWheel(currentAngle);}
    updateSpinBtn();
  }catch(e){}
}

function updateWheelVisibility(){
  const sec=document.getElementById('wheelSection');
  if(wheelSettings.enabled&&wheelItems.length>0){sec.classList.add('visible');}
  else{sec.classList.remove('visible');}
}

function buildOffscreen(){
  const canvas=document.getElementById('wheelCanvas');
  const SIZE=canvas.width;
  offscreen=document.createElement('canvas');
  offscreen.width=SIZE;offscreen.height=SIZE;
  const ctx=offscreen.getContext('2d');
  const cx=SIZE/2,cy=SIZE/2,R=SIZE/2-3;
  const total=wheelItems.reduce((s,i)=>s+(i.weight||1),0);
  let angle=-Math.PI/2;
  wheelItems.forEach((item,idx)=>{
    const slice=(item.weight||1)/total*Math.PI*2;
    const col=WHEEL_SEG_COLORS[idx%WHEEL_SEG_COLORS.length];
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,angle,angle+slice);ctx.closePath();
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    grad.addColorStop(0,'rgba(255,255,255,0.18)');grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angle)*R,cy+Math.sin(angle)*R);
    ctx.strokeStyle='rgba(2,11,24,0.5)';ctx.lineWidth=2;ctx.stroke();
    if(slice>0.22){
      ctx.save();
      ctx.translate(cx,cy);ctx.rotate(angle+slice/2);
      ctx.textAlign='right';
      ctx.fillStyle='rgba(255,255,255,0.97)';
      ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=3;
      const fontSize=Math.min(14,Math.max(9,R*0.16));
      ctx.font=`900 ${fontSize}px Nunito,sans-serif`;
      const maxLen=Math.floor(R*0.28);
      let txt=item.label;
      if(ctx.measureText(txt).width>maxLen) txt=txt.slice(0,Math.max(3,Math.floor(maxLen/fontSize*1.5)))+'…';
      ctx.fillText(txt,R-8,fontSize*0.38);
      ctx.restore();
    }
    angle+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(168,228,255,0.2)';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);
  ctx.fillStyle='rgba(2,11,24,0.95)';ctx.fill();
  ctx.strokeStyle='rgba(204,93,232,0.7)';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);
  ctx.fillStyle='rgba(204,93,232,0.9)';ctx.fill();
}

function drawWheel(angle){
  const canvas=document.getElementById('wheelCanvas');
  if(!canvas||!offscreen)return;
  const ctx=canvas.getContext('2d');
  const cx=canvas.width/2,cy=canvas.height/2;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(angle);
  ctx.translate(-cx,-cy);
  ctx.drawImage(offscreen,0,0);
  ctx.restore();
}

function easeOut5(t){return 1-Math.pow(1-t,5);}

function pickWinner(){
  const total=wheelItems.reduce((s,i)=>s+(i.weight||1),0);
  let r=Math.random()*total;
  for(let i=0;i<wheelItems.length;i++){r-=(wheelItems[i].weight||1);if(r<=0)return i;}
  return wheelItems.length-1;
}

function segmentAngle(idx){
  const total=wheelItems.reduce((s,i)=>s+(i.weight||1),0);
  let a=-Math.PI/2;
  for(let i=0;i<idx;i++) a+=(wheelItems[i].weight||1)/total*Math.PI*2;
  a+=(wheelItems[idx].weight||1)/total*Math.PI*2/2;
  return a;
}

async function startSpin(){
  if(isSpinning||wheelItems.length===0||timerEnded)return;
  if(!checkCooldown())return;
  isSpinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('spinBtn').classList.remove('ready');
  spinTargetIdx=pickWinner();
  const winner=wheelItems[spinTargetIdx];
  const segCenter=segmentAngle(spinTargetIdx);
  const fullRotations=5+Math.floor(Math.random()*3);
  const targetOffset=(-segCenter-currentAngle%(Math.PI*2)+Math.PI*2*10)%(Math.PI*2);
  spinTotalRotation=Math.PI*2*fullRotations+targetOffset;
  spinStartAngle=currentAngle;
  spinStartTime=performance.now();
  fetch(FB+'/wheelSpins/'+team+'.json',{method:'PUT',body:JSON.stringify({lastSpinAt:Date.now(),result:winner.label,points:winner.points||0})});
  lastSpinAt=Date.now();
  if(spinRAF)cancelAnimationFrame(spinRAF);
  spinRAF=requestAnimationFrame(rafSpin);
}

function rafSpin(now){
  const elapsed=now-spinStartTime;
  const t=Math.min(1,elapsed/spinDuration);
  const eased=easeOut5(t);
  currentAngle=spinStartAngle+spinTotalRotation*eased;
  drawWheel(currentAngle);
  if(t<1){spinRAF=requestAnimationFrame(rafSpin);}
  else{spinRAF=null;isSpinning=false;currentAngle=spinStartAngle+spinTotalRotation;drawWheel(currentAngle);onSpinComplete();}
}

async function onSpinComplete(){
  const winner=wheelItems[spinTargetIdx];
  if((winner.points||0)>0){
    const res=await fetch(FB+"/teams/"+team+".json");let current=await res.json();
    current=(current||0)+(winner.points||0);
    await fetch(FB+"/teams/"+team+".json",{method:"PUT",body:JSON.stringify(current)});
    document.getElementById("score").innerText=current;
    const logEntry={team,eventName:'🎡 '+winner.label,points:winner.points,time:Date.now()};
    await fetch(FB+'/completions/'+Date.now()+'_'+team+'.json',{method:'PUT',body:JSON.stringify(logEntry)});
  }
  const col=WHEEL_SEG_COLORS[spinTargetIdx%WHEEL_SEG_COLORS.length];
  const nameEl=document.getElementById('resultName');
  const ptsEl=document.getElementById('resultPts');
  nameEl.textContent=winner.label;
  nameEl.style.color=col;
  nameEl.style.textShadow=`0 0 30px ${col}`;
  ptsEl.textContent=(winner.points||0)>0?`+${winner.points} POINTS!`:'Better luck next time!';
  ptsEl.style.color=(winner.points||0)>0?'#f0c040':'rgba(168,228,255,0.5)';
  document.getElementById('resultOverlay').classList.add('show');
  if(!LOW_END&&(winner.points||0)>0) spawnConfetti(col);
  updateSpinBtn();
}

function dismissResult(){
  document.getElementById('resultOverlay').classList.remove('show');
  stopConfetti();
}

function checkCooldown(){
  const coolMs=wheelSettings.cooldownMinutes*60*1000;
  const elapsed=Date.now()-lastSpinAt;
  return elapsed>=coolMs||lastSpinAt===0;
}

function updateSpinBtn(){
  const btn=document.getElementById('spinBtn');
  const msg=document.getElementById('wheelCooldownMsg');
  if(timerEnded){btn.disabled=true;btn.classList.remove('ready');msg.textContent='⏰ Match over — wheel locked';return;}
  if(wheelItems.length===0){btn.disabled=true;msg.textContent='No wheel items set up yet';return;}
  const coolMs=wheelSettings.cooldownMinutes*60*1000;
  const remaining=coolMs-(Date.now()-lastSpinAt);
  if(lastSpinAt>0&&remaining>0){
    btn.disabled=true;btn.classList.remove('ready');
    const m=Math.floor(remaining/60000);const s=Math.floor((remaining%60000)/1000);
    msg.textContent=`⏳ Next spin in ${m}:${String(s).padStart(2,'0')}`;
  } else {
    btn.disabled=false;btn.classList.add('ready');
    msg.textContent=lastSpinAt>0?'Ready to spin again!':'';
  }
}
setInterval(updateSpinBtn,1000);

/* ─────────────── CONFETTI ─────────────── */
let confettiParticles=[];
let confettiRAF=null;
let confettiActive=false;
const confettiCanvas=document.getElementById('confettiCanvas');
const confettiCtx=confettiCanvas.getContext('2d');
function resizeConfetti(){confettiCanvas.width=window.innerWidth;confettiCanvas.height=window.innerHeight;}
resizeConfetti();window.addEventListener('resize',resizeConfetti,{passive:true});

function spawnConfetti(accentColor){
  if(LOW_END)return;
  confettiParticles=[];
  const W=confettiCanvas.width,H=confettiCanvas.height;
  const colors=['#cc5de8','#f0c040','#6bcb77','#4d96ff','#ff6b6b','#ffd93d',accentColor];
  for(let i=0;i<60;i++){
    confettiParticles.push({
      x:W*0.5+(Math.random()-0.5)*W*0.4,y:H*0.35+(Math.random()-0.5)*H*0.2,
      vx:(Math.random()-0.5)*7,vy:-4-Math.random()*6,
      rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.18,
      w:7+Math.random()*7,h:4+Math.random()*4,
      color:colors[Math.floor(Math.random()*colors.length)],
      alpha:1,gravity:0.22
    });
  }
  confettiActive=true;
  if(confettiRAF)cancelAnimationFrame(confettiRAF);
  confettiRAF=requestAnimationFrame(tickConfetti);
  setTimeout(stopConfetti,3000);
}

function tickConfetti(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  let alive=false;
  for(const p of confettiParticles){
    if(p.alpha<=0.02)continue;alive=true;
    confettiCtx.save();confettiCtx.globalAlpha=p.alpha;
    confettiCtx.translate(p.x,p.y);confettiCtx.rotate(p.rot);
    confettiCtx.fillStyle=p.color;confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    confettiCtx.restore();
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=0.99;p.rot+=p.rotV;p.alpha-=0.013;p.radius*=0.98||1;
  }
  if(alive&&confettiActive)confettiRAF=requestAnimationFrame(tickConfetti);
  else{confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);confettiRAF=null;}
}
function stopConfetti(){confettiActive=false;}

/* ─────────────── WHEEL RESPONSIVE ─────────────── */
function resizeWheel(){
  const wrap=document.getElementById('wheelWrap');if(!wrap)return;
  const size=Math.min(280,window.innerWidth-80);
  wrap.style.width=size+'px';wrap.style.height=size+'px';
  const canvas=document.getElementById('wheelCanvas');canvas.width=size;canvas.height=size;
  if(wheelItems.length>0){buildOffscreen();drawWheel(currentAngle);}
}
window.addEventListener('resize',resizeWheel,{passive:true});

/* ─────────────── TIMER ─────────────── */
async function pollTimer(){
  try{
    const res=await fetch(FB+'/timer.json');const t=(await res.json())||{};
    let remaining=t.remaining||0;
    if(t.state==='running'&&t.serverTime) remaining=Math.max(0,remaining-(Date.now()-t.serverTime)/1000);
    const ended=(t.state==='running'&&remaining<=0)||(t.state==='ended');
    const wasEnded=timerEnded;timerEnded=ended;
    if(ended!==wasEnded)applyTimerLock(ended);
  }catch(e){}
}

function applyTimerLock(ended){
  const lapBtn=document.getElementById('pointBtn');
  lapBtn.disabled=ended;lapBtn.style.opacity=ended?'0.4':'';
  lapBtn.style.cursor=ended?'not-allowed':'';
  const spinBtn=document.getElementById('spinBtn');
  if(ended){spinBtn.disabled=true;spinBtn.classList.remove('ready');document.getElementById('wheelCooldownMsg').textContent='⏰ Match over — wheel locked';}
  else{updateSpinBtn();}
  const completeBtn=document.getElementById('completeBtn');if(ended)completeBtn.disabled=true;
  if(ended){lapBtn.querySelector('span').textContent='⏰ TIME\'S UP';}
  else{lapBtn.querySelector('span').textContent='+2 LAPS';}
}

/* ─────────────── CURRENCY ─────────────── */
let _lastGold=-1,_lastMako=-1;

async function pollCurrency(){
  try{
    const res=await fetch(FB+'/currency/'+team+'.json');
    const data=(await res.json())||{};
    const gold=data.gold||0;
    const mako=data.mako||0;
    if(gold!==_lastGold){
      document.getElementById('goldCount').textContent=gold;
      if(_lastGold>=0&&gold>_lastGold)bump('goldBadge');
      _lastGold=gold;
    }
    if(mako!==_lastMako){
      document.getElementById('makoCount').textContent=mako;
      document.getElementById('shopBalanceCount').textContent=mako;
      if(_lastMako>=0&&mako>_lastMako)bump('makoBadge');
      _lastMako=mako;
      _makoBalance=mako;
      // Refresh afford state
      renderShopAffordability();
    }
  }catch(e){}
}

function bump(id){
  const el=document.getElementById(id);el.classList.remove('bump');
  void el.offsetWidth;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),400);
}

   MAKO SHOP ENGINE
══════════════════════════════════════ */

async function loadShop(){
  try{
    const [itemsRes, settingsRes] = await Promise.all([
      fetch(FB+'/shopItems.json'),
      fetch(FB+'/shopSettings.json')
    ]);
    const itemsData = (await itemsRes.json()) || {};
    const settingsData = (await settingsRes.json()) || {};
    const enabled = settingsData.enabled !== false; // default true if not set

    shopItems = Object.entries(itemsData)
      .map(([id, v]) => ({id, ...v}))
      .filter(i => i.enabled !== false)
      .sort((a,b) => (a.sortOrder||99) - (b.sortOrder||99) || a.name.localeCompare(b.name));

    const section = document.getElementById('shopSection');
    if(enabled && shopItems.length > 0){
      section.classList.add('visible');
      renderShop();
    } else {
      section.classList.remove('visible');
    }
  }catch(e){}
}

function getItemTypeClass(item){
  if(item.type==='powerup') return 'powerup';
  if(item.type==='sabotage') return 'sabotage';
  return '';
}

function getItemTypeBadgeText(item){
  if(item.type==='powerup') return '⚡ POWER-UP';
  if(item.type==='sabotage') return '💀 SABOTAGE';
  return '🛒 ITEM';
}

function renderShop(){
  const grid = document.getElementById('shopGrid');
  if(shopItems.length === 0){
    grid.innerHTML = '<div class="shop-empty" style="grid-column:1/-1">No items in the shop yet!</div>';
    return;
  }
  grid.innerHTML = shopItems.map(item => {
    const typeClass = getItemTypeClass(item);
    const cantAfford = _makoBalance < (item.price||0);
    return `<div class="shop-item ${typeClass}${cantAfford?' cant-afford':''}" id="si_${item.id}">
      <div class="shop-item-emoji">${item.emoji||'🛒'}</div>
      <div class="shop-item-name">${item.name}</div>
      ${item.description?`<div class="shop-item-desc">${item.description}</div>`:''}
      <div class="shop-item-type-badge">${getItemTypeBadgeText(item)}</div>
      <div class="shop-item-price">
        <img class="shop-price-img" src="${MAKO_IMG}" alt="Mako">
        ${item.price||0}
      </div>
      <button class="shop-buy-btn" onclick="openShopModal('${item.id}')" ${cantAfford||timerEnded?'disabled':''}>
        <span>${cantAfford?'NOT ENOUGH':'BUY!'}</span>
      </button>
    </div>`;
  }).join('');
}

function renderShopAffordability(){
  // Only update afford state without full re-render (avoids DOM churn)
  shopItems.forEach(item => {
    const el = document.getElementById('si_'+item.id);
    if(!el) return;
    const cantAfford = _makoBalance < (item.price||0);
    el.classList.toggle('cant-afford', cantAfford);
    const btn = el.querySelector('.shop-buy-btn');
    if(btn){
      btn.disabled = cantAfford || timerEnded;
      btn.querySelector('span').textContent = cantAfford ? 'NOT ENOUGH' : 'BUY!';
    }
  });
}

function openShopModal(itemId){
  const item = shopItems.find(i => i.id === itemId);
  if(!item) return;
  if(_makoBalance < (item.price||0)) return;
  pendingPurchase = item;

  const inner = document.getElementById('shopModalInner');
  inner.className = 'shop-modal ' + getItemTypeClass(item);
  document.getElementById('shopModalEmoji').textContent = item.emoji || '🛒';
  document.getElementById('shopModalName').textContent = item.name;
  document.getElementById('shopModalDesc').textContent = item.description || '';
  document.getElementById('shopModalCost').textContent = item.price || 0;
  document.getElementById('shopModal').classList.add('open');
}

function closeShopModal(){
  document.getElementById('shopModal').classList.remove('open');
  pendingPurchase = null;
}

async function confirmPurchase(){
  if(!pendingPurchase) return;
  const item = pendingPurchase;
  closeShopModal();

  // Re-check balance (race condition guard)
  const freshRes = await fetch(FB+'/currency/'+team+'.json');
  const freshData = (await freshRes.json()) || {};
  const currentMako = freshData.mako || 0;
  if(currentMako < (item.price||0)){
    showToast('Not enough Mako Coins!');
    return;
  }

  // Deduct coins
  const newMako = currentMako - (item.price||0);
  await fetch(FB+'/currency/'+team+'/mako.json', {method:'PUT', body:JSON.stringify(newMako)});

  // Log purchase
  const logEntry = {
    team,
    itemId: item.id,
    itemName: item.name,
    itemType: item.type || 'item',
    itemEmoji: item.emoji || '🛒',
    cost: item.price || 0,
    time: Date.now()
  };
  await fetch(FB+'/shopPurchases/'+Date.now()+'_'+team+'.json', {method:'PUT', body:JSON.stringify(logEntry)});

  // Update local state
  _makoBalance = newMako;
  _lastMako = newMako;
  document.getElementById('makoCount').textContent = newMako;
  document.getElementById('shopBalanceCount').textContent = newMako;
  bump('makoBadge');
  renderShopAffordability();

  // Show success
  showPurchaseSuccess(item);
  pendingPurchase = null;
}

function showPurchaseSuccess(item){
  document.getElementById('purchaseSuccessEmoji').textContent = item.emoji || '🎉';
  document.getElementById('purchaseSuccessName').textContent = item.name;
  document.getElementById('purchaseSuccessCost').textContent = '-' + (item.price||0) + ' Mako';
  const overlay = document.getElementById('purchaseSuccess');
  overlay.classList.add('show');
  if(!LOW_END) spawnConfetti('#4d96ff');
  setTimeout(()=>{
    overlay.classList.remove('show');
    stopConfetti();
  }, 2200);
}

function showToast(msg){
  // Reuse body for simple inline toast
  const t = document.createElement('div');
  t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(5,20,40,0.95);border:1px solid rgba(0,229,255,0.3);border-radius:12px;padding:12px 28px;font-size:14px;font-weight:700;color:#a8e4ff;z-index:300;white-space:nowrap;font-family:Nunito,sans-serif';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

document.getElementById('shopModal').addEventListener('click', function(e){
  if(e.target === this) closeShopModal();
});
