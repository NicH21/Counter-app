<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Team</title>
</head>
<body style="font-family: Arial; text-align:center; margin-top:80px">
<h1>Choose Your Team</h1>
<button id="teamA" onclick="choose('teamA')" style="font-size:20px; margin:10px;">Team A</button>
<button id="teamB" onclick="choose('teamB')" style="font-size:20px; margin:10px;">Team B</button>
<button id="teamC" onclick="choose('teamC')" style="font-size:20px; margin:10px;">Team C</button>
 
<script>
const url = "https://counterapp-5297b-default-rtdb.firebaseio.com/selectedTeams";
localStorage.removeItem("myTeam"); 
async function choose(team) {
  // Save chosen team locally BEFORE redirecting
  localStorage.setItem("myTeam", team);
 
  // Mark team as taken in Firebase
  await fetch(url + "/" + team + ".json", {
    method: "PUT",
    body: JSON.stringify(true)
  });
 
  window.location.href = "./teams.html";
}
 
async function loadTeams() {
  let res = await fetch(url + ".json");
  let data = await res.json();
  if (!data) return;
 
  ["teamA", "teamB", "teamC"].forEach(team => {
    if (data[team] === true) {
      const btn = document.getElementById(team);
      const label = team.replace("team", "Team ");
      btn.disabled = true;
      btn.innerText = label + " (Taken)";
    }
  });
}
 
// Poll every 2 seconds so all devices see changes live
loadTeams();
setInterval(loadTeams, 2000);
</script>
</body>
</html>
