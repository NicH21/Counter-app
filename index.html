<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Team</title>
</head>

<body style="font-family: Arial; text-align:center; margin-top:80px">

<h1>Choose Your Team</h1>

<button id="teamA" onclick="choose('teamA')" style="font-size:20px; margin:10px;">
  Team A
</button>

<button id="teamB" onclick="choose('teamB')" style="font-size:20px; margin:10px;">
  Team B
</button>

<button id="teamC" onclick="choose('teamC')" style="font-size:20px; margin:10px;">
  Team C
</button>

<script>
function choose(team) {
    localStorage.setItem("myTeam", team);
    window.location.href = "teams.html";
}

// disable already selected team
let saved = localStorage.getItem("myTeam");

if (saved) {
    document.getElementById(saved).disabled = true;
    document.getElementById(saved).innerText = saved + " (Selected)";
}
</script>

</body>
</html>
