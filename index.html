<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Your Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep: #020b18; --mid: #053a5f; --surface: #0a6fa8;
      --foam: #a8e4ff; --accent: #00e5ff; --danger: #ff4040;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--deep);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ocean-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(180deg, #020b18 0%, #053a5f 55%, #0a6fa8 100%); }
    .bubbles { position: absolute; inset: 0; pointer-events: none; }
    .bubble { position: absolute; bottom: -60px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(168,228,255,0.6), rgba(10,111,168,0.1)); border: 1px solid rgba(168,228,255,0.3); animation: riseUp linear infinite; }
    @keyframes riseUp { 0%{transform:translateX(0) translateY(0) scale(1);opacity:0.7} 50%{transform:translateX(20px) translateY(-50vh) scale(1.05);opacity:0.5} 100%{transform:translateX(-10px) translateY(-105vh) scale(0.8);opacity:0} }
    .rays { position: absolute; top: 0; left: 0; width: 100%; height: 60%; pointer-events: none; overflow: hidden; }
    .ray { position: absolute; top: -20%; width: 60px; height: 120%; background: linear-gradient(180deg, rgba(0,229,255,0.07) 0%, transparent 100%); transform-origin: top center; animation: sway ease-in-out infinite; border-radius: 50%; }
    @keyframes sway { 0%,100%{transform:rotate(-8deg) scaleX(1)} 50%{transform:rotate(8deg) scaleX(1.3)} }
    .seafloor { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: radial-gradient(ellipse at 50% 100%, #0d2236 60%, transparent 100%); z-index: 1; }
    .waves-wrap { position: fixed; top: 0; left: 0; right: 0; height: 90px; z-index: 3; overflow: hidden; }
    .wave-svg { width: 200%; animation: waveScroll 6s linear infinite; }
    .wave-svg2 { width: 200%; animation: waveScroll 9s linear infinite reverse; opacity: 0.5; margin-top: -40px; }
    @keyframes waveScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .shark-wrap { position: fixed; z-index: 4; pointer-events: none; animation: sharkSwim 14s ease-in-out infinite; bottom: 18%; }
    @keyframes sharkSwim { 0%{left:-200px;transform:scaleX(1) translateY(0px)} 10%{transform:scaleX(1) translateY(-30px)} 20%{transform:scaleX(1) translateY(10px)} 45%{left:110vw;transform:scaleX(1) translateY(-20px)} 46%{left:110vw;transform:scaleX(-1) translateY(-20px)} 55%{transform:scaleX(-1) translateY(10px)} 70%{transform:scaleX(-1) translateY(-25px)} 90%{left:-200px;transform:scaleX(-1) translateY(5px)} 91%{left:-200px;transform:scaleX(1) translateY(5px)} 100%{left:-200px;transform:scaleX(1) translateY(0px)} }
    .shark-svg { width: 260px; filter: drop-shadow(0 0 14px rgba(168,228,255,0.55)) drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
    .shark-fin { transform-origin: bottom center; animation: finWiggle 0.6s ease-in-out infinite alternate; }
    @keyframes finWiggle { 0%{transform:rotate(-4deg)} 100%{transform:rotate(4deg)} }
    .shark-tail { transform-origin: left center; animation: tailWag 0.5s ease-in-out infinite alternate; }
    @keyframes tailWag { 0%{transform:rotate(-12deg)} 100%{transform:rotate(12deg)} }
    .content { position: relative; z-index: 5; width: 100%; max-width: 760px; padding: 110px 24px 100px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Bangers', cursive; font-size: clamp(52px, 10vw, 88px); letter-spacing: 4px; color: var(--foam); text-shadow: 0 0 30px var(--accent), 0 4px 0 var(--mid), 0 8px 30px rgba(0,0,0,0.6); line-height: 1; margin-bottom: 6px; animation: titlePulse 3s ease-in-out infinite; }
    @keyframes titlePulse { 0%,100%{text-shadow:0 0 30px var(--accent),0 4px 0 var(--mid),0 8px 30px rgba(0,0,0,0.6)} 50%{text-shadow:0 0 60px var(--accent),0 0 80px rgba(0,229,255,0.3),0 4px 0 var(--mid)} }
    .subtitle { font-size: 16px; color: rgba(168,228,255,0.65); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 44px; }
    .team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; margin-bottom: 32px; }
    @media (max-width: 560px) { .team-grid { grid-template-columns: repeat(2, 1fr); } }
    .team-btn { position: relative; font-family: 'Bangers', cursive; font-size: 20px; letter-spacing: 2px; padding: 16px 8px; border-radius: 16px; cursor: pointer; border: 2px solid rgba(0,229,255,0.5); background: linear-gradient(145deg, rgba(5,58,95,0.9), rgba(2,11,24,0.95)); color: var(--foam); overflow: hidden; transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s; box-shadow: 0 0 12px rgba(0,229,255,0.2), inset 0 1px 0 rgba(168,228,255,0.1); }
    .team-btn::before { content:""; position:absolute; top:0; left:-120%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(0,229,255,0.5),transparent); transform:skewX(-20deg); animation:shine 2.5s linear infinite; }
    .team-btn span { position: relative; z-index: 2; }
    @keyframes shine { 0%{left:-120%} 100%{left:160%} }
    .team-btn:hover:not(:disabled) { transform: translateY(-4px) scale(1.04); border-color: var(--accent); box-shadow: 0 0 28px rgba(0,229,255,0.55), inset 0 1px 0 rgba(168,228,255,0.15); }
    .team-btn:active:not(:disabled) { transform: scale(0.97); }
    .team-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: rgba(51,68,85,0.5); box-shadow: none; animation: none; }
    .team-btn:disabled::before { display: none; }
    .t1{--tc:#ff6b6b}.t2{--tc:#ffd93d}.t3{--tc:#6bcb77}.t4{--tc:#4d96ff}.t5{--tc:#ff922b}.t6{--tc:#cc5de8}.t7{--tc:#20c997}.t8{--tc:#f06595}.t9{--tc:#74c0fc}.t10{--tc:#ff8787}.t11{--tc:#a9e34b}.t12{--tc:#ffa94d}
    .team-btn.t1,.team-btn.t2,.team-btn.t3,.team-btn.t4,.team-btn.t5,.team-btn.t6,.team-btn.t7,.team-btn.t8,.team-btn.t9,.team-btn.t10,.team-btn.t11,.team-btn.t12 { border-color:var(--tc); box-shadow:0 0 14px color-mix(in srgb,var(--tc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,0.08); }
    .team-btn.t1:hover:not(:disabled),.team-btn.t2:hover:not(:disabled),.team-btn.t3:hover:not(:disabled),.team-btn.t4:hover:not(:disabled),.team-btn.t5:hover:not(:disabled),.team-btn.t6:hover:not(:disabled),.team-btn.t7:hover:not(:disabled),.team-btn.t8:hover:not(:disabled),.team-btn.t9:hover:not(:disabled),.team-btn.t10:hover:not(:disabled),.team-btn.t11:hover:not(:disabled),.team-btn.t12:hover:not(:disabled) { box-shadow:0 0 36px color-mix(in srgb,var(--tc) 70%,transparent),inset 0 1px 0 rgba(255,255,255,0.12); }
    .team-emoji { display: block; font-size: 24px; margin-bottom: 3px; }
    .team-btn-name { display: block; font-size: 17px; line-height: 1.2; }
    .bottom-btns { display: flex; gap: 14px; margin-top: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
    .lb-btn { position: relative; font-family: 'Bangers', cursive; font-size: 26px; letter-spacing: 3px; padding: 15px 40px; border-radius: 16px; background: #080f1a; color: white; cursor: pointer; overflow: hidden; border: 2px solid #00aaff; box-shadow: 0 0 18px rgba(0,170,255,0.6), 0 0 40px rgba(0,170,255,0.2); transition: transform 0.15s, box-shadow 0.2s; flex: 1; min-width: 180px; }
    .lb-btn::before { content:""; position:absolute; top:0; left:-120%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(0,170,255,0.9),transparent); transform:skewX(-25deg); animation:shine 2s linear infinite; }
    .lb-btn span { position: relative; z-index: 2; }
    .lb-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 0 32px rgba(0,170,255,0.9), 0 0 60px rgba(0,170,255,0.3); }
    .admin-btn { position: relative; font-family: 'Bangers', cursive; font-size: 26px; letter-spacing: 3px; padding: 15px 40px; border-radius: 16px; background: #080f1a; color: white; cursor: pointer; overflow: hidden; border: 2px solid #ff4040; box-shadow: 0 0 18px rgba(255,64,64,0.5), 0 0 40px rgba(255,64,64,0.15); transition: transform 0.15s, box-shadow 0.2s; flex: 1; min-width: 180px; display: inline-flex; align-items: center; justify-content: center; }
    .admin-btn::before { content:""; position:absolute; top:0; left:-120%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,64,64,0.7),transparent); transform:skewX(-25deg); animation:shine 2.8s linear infinite; }
    .admin-btn span { position: relative; z-index: 2; }
    .admin-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 0 32px rgba(255,64,64,0.8), 0 0 60px rgba(255,64,64,0.3); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(2,11,24,0.85); backdrop-filter: blur(6px); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: linear-gradient(145deg, rgba(5,20,40,0.98), rgba(2,11,24,0.98)); border: 2px solid rgba(255,64,64,0.4); border-radius: 20px; padding: 36px 32px 28px; width: 90%; max-width: 340px; text-align: center; box-shadow: 0 0 40px rgba(255,64,64,0.25), 0 20px 60px rgba(0,0,0,0.5); }
    .modal h2 { font-family: 'Bangers', cursive; font-size: 36px; letter-spacing: 3px; color: #ff4040; text-shadow: 0 0 20px rgba(255,64,64,0.4); margin-bottom: 6px; }
    .modal p { font-size: 13px; color: rgba(168,228,255,0.5); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 24px; }
    .pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,64,64,0.5); background: transparent; transition: background 0.15s, border-color 0.15s; }
    .pin-dot.filled { background: #ff4040; border-color: #ff4040; box-shadow: 0 0 8px rgba(255,64,64,0.6); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .pin-key { font-family: 'Bangers', cursive; font-size: 26px; padding: 14px 0; border-radius: 12px; border: 1.5px solid rgba(0,229,255,0.2); background: rgba(5,30,55,0.8); color: var(--foam); cursor: pointer; transition: transform 0.1s, background 0.15s, border-color 0.15s; }
    .pin-key:hover { background: rgba(0,229,255,0.12); border-color: rgba(0,229,255,0.5); box-shadow: 0 0 12px rgba(0,229,255,0.3); }
    .pin-key:active { transform: scale(0.93); }
    .pin-key.del { border-color: rgba(255,107,107,0.3); color: #ff6b6b; font-size: 20px; }
    .pin-key.del:hover { background: rgba(255,64,64,0.12); border-color: rgba(255,64,64,0.5); }
    .pin-error { font-size: 13px; color: #ff6b6b; letter-spacing: 1px; height: 18px; margin-bottom: 8px; }
    .modal-cancel { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; padding: 9px 24px; border-radius: 9px; border: 1px solid rgba(168,228,255,0.2); background: transparent; color: rgba(168,228,255,0.5); cursor: pointer; letter-spacing: 1px; transition: background 0.2s, color 0.2s; }
    .modal-cancel:hover { background: rgba(168,228,255,0.08); color: #a8e4ff; }
    #splashCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  </style>
</head>

  <div class="rays" id="rays"></div>

</div>
<div class="seafloor"></div>
<div class="waves-wrap">
  <svg class="wave-svg" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

    </g>
    <path d="M45,55 C60,42 90,38 130,40 C165,42 200,48 225,58 C242,64 250,70 248,76 C240,88 200,90 160,88 C120,86 80,84 55,78 C40,74 35,68 45,55 Z" fill="url(#sharkGrad)"/>
    <path d="M60,72 C85,78 130,82 175,80 C200,79 225,76 238,72 C230,84 195,88 155,88 C110,88 72,84 55,78 Z" fill="url(#bellyGrad)" opacity="0.85"/>

    <path d="M170,78 C188,90 210,100 205,96 C195,94 178,86 168,82 Z" fill="url(#sharkGrad)" opacity="0.9"/>
    <path d="M95,40 C100,30 108,26 112,28 C108,34 102,38 98,40 Z" fill="url(#sharkGrad)" opacity="0.8"/>
    <path d="M90,86 C94,96 100,100 98,98 C93,94 88,90 86,86 Z" fill="url(#sharkGrad)" opacity="0.75"/>
    <path d="M220,48 C235,52 252,60 255,68 C252,76 235,80 220,82 C230,74 235,68 235,65 C235,62 230,56 220,48 Z" fill="url(#sharkGrad)"/>
    <path d="M248,62 C254,64 258,66 257,68 C256,70 252,72 248,72 C252,70 254,68 254,66 Z" fill="#ddeef8"/>
    <circle cx="232" cy="60" r="5.5" fill="#0a1a2e"/>
    <circle cx="233.5" cy="58.5" r="1.8" fill="rgba(255,255,255,0.7)"/>
    <path d="M244,68 Q250,74 255,70" stroke="#0a1a2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <polygon points="245,69 247,75 249,69" fill="white"/>

    <path d="M213,52 Q211,65 213,78" stroke="#7ab0c8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M205,50 Q203,65 205,80" stroke="#7ab0c8" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  </svg>
</div>
<canvas id="splashCanvas"></canvas>

<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <h2>⚙️ ADMIN</h2>
    <p>Enter PIN to continue</p>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="dot0"></div><div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div><div class="pin-dot" id="dot3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>

<div class="content">
  <h1 class="title">Mako Swimathon</h1>
  <p class="subtitle">Choose your squad!</p>
  <div class="team-grid" id="teamGrid"></div>
  <div class="bottom-btns">
    <button class="lb-btn" onclick="window.location.href='./leaderboard.html'"><span>📊 LEADERBOARD</span></button>
    <button class="admin-btn" onclick="openAdminModal()"><span>ADMIN</span></button>
  </div>
</div>

<script>
const TEAMS = ['team1','team2','team3','team4','team5','team6','team7','team8','team9','team10','team11','team12'];
const COLORS = {team1:'#ff6b6b',team2:'#ffd93d',team3:'#6bcb77',team4:'#4d96ff',team5:'#ff922b',team6:'#cc5de8',team7:'#20c997',team8:'#f06595',team9:'#74c0fc',team10:'#ff8787',team11:'#a9e34b',team12:'#ffa94d'};
const EMOJIS = {team1:'🔴',team2:'⚡',team3:'🌿',team4:'💧',team5:'🔥',team6:'💜',team7:'🌊',team8:'🌸',team9:'🩵',team10:'🎯',team11:'🍏',team12:'🧡'};
const FB = "https://counterapp-5297b-default-rtdb.firebaseio.com";
const ADMIN_PIN = '1234';

/* bubbles */
const bubblesEl = document.getElementById('bubbles');
for(let i=0;i<28;i++){const b=document.createElement('div');b.className='bubble';const s=6+Math.random()*22;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:-${Math.random()*14}s;`;bubblesEl.appendChild(b);}
const raysEl=document.getElementById('rays');
for(let i=0;i<7;i++){const r=document.createElement('div');r.className='ray';r.style.cssText=`left:${5+i*14}%;animation-duration:${4+Math.random()*4}s;animation-delay:-${Math.random()*4}s;opacity:${0.4+Math.random()*0.5};`;raysEl.appendChild(r);}

/* splash */
const canvas=document.getElementById('splashCanvas');const ctx=canvas.getContext('2d');let particles=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}resizeCanvas();window.addEventListener('resize',resizeCanvas);
function spawnSplash(x,y,color){for(let i=0;i<55;i++){const angle=(Math.PI*2/55)*i+(Math.random()-0.5)*0.5;const speed=3+Math.random()*9;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-Math.random()*6,radius:3+Math.random()*5,alpha:1,color:color||'#a8e4ff',gravity:0.3});}for(let i=0;i<18;i++){particles.push({x:x+(Math.random()-0.5)*60,y:y+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*5,vy:-Math.random()*7,radius:2+Math.random()*4,alpha:0.85,color:'#ffffff',gravity:0.25});}}
function animateSplash(){ctx.clearRect(0,0,canvas.width,canvas.height);particles=particles.filter(p=>p.alpha>0.02);for(const p of particles){ctx.save();ctx.globalAlpha=p.alpha;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle=p.color;ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.fill();ctx.restore();p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=0.97;p.alpha-=0.022;p.radius*=0.98;}requestAnimationFrame(animateSplash);}animateSplash();

localStorage.removeItem("myTeam");
let teamNames = {};

function buildGrid(selectedData) {
  const grid = document.getElementById('teamGrid');
  grid.innerHTML = TEAMS.map((k,i) => {
    const num = i+1;
    const cls = `t${num}`;
    const taken = selectedData && selectedData[k] === true;
    const name = teamNames[k] || `Team ${num}`;
    return `<button id="${k}" class="team-btn ${cls}${taken?' disabled-btn':''}" onclick="choose('${k}')" ${taken?'disabled':''}>
      <span><span class="team-emoji">${EMOJIS[k]}</span><span class="team-btn-name">${name}</span></span>
    </button>`;
  }).join('');
}

async function loadTeams() {
  try {
    const [selRes, namesRes] = await Promise.all([
      fetch(FB+'/selectedTeams.json'),
      fetch(FB+'/teamNames.json')
    ]);
    const selData = await selRes.json() || {};
    const namesData = await namesRes.json() || {};
    teamNames = namesData;
    TEAMS.forEach(k => {
      const btn = document.getElementById(k);
      if (!btn) return;
      const num = k.replace('team','');
      const name = namesData[k] || `Team ${num}`;
      const taken = selData && selData[k] === true;
      btn.disabled = taken;
      btn.querySelector('.team-btn-name').textContent = name;
      if (taken) {
        btn.querySelector('.team-emoji').textContent = '🚫';
        btn.querySelector('.team-btn-name').innerHTML = name + '<br><small style="font-size:12px;opacity:0.7">Taken</small>';
      } else {
        btn.querySelector('.team-emoji').textContent = EMOJIS[k];
      }
    });
  } catch(e) {}
}

async function initGrid() {
  try {
    const [selRes, namesRes] = await Promise.all([
      fetch(FB+'/selectedTeams.json'),
      fetch(FB+'/teamNames.json')
    ]);
    const selData = await selRes.json() || {};
    const namesData = await namesRes.json() || {};
    teamNames = namesData;
    buildGrid(selData);
  } catch(e) { buildGrid({}); }
}

async function choose(team) {
  const btn = document.getElementById(team);
  if (btn.disabled) return;
  const rect = btn.getBoundingClientRect();
  spawnSplash(rect.left+rect.width/2, rect.top+rect.height/2, COLORS[team]);
  localStorage.setItem("myTeam", team);
  await fetch(FB+'/selectedTeams/'+team+'.json', {method:"PUT", body:JSON.stringify(true)});
  setTimeout(()=>{ window.location.href='./teams.html'; }, 600);
}

initGrid();
setInterval(loadTeams, 2000);

/* PIN */
let pinEntry='';
function openAdminModal(){pinEntry='';updatePinUI();document.getElementById('pinError').textContent='';document.getElementById('adminModal').classList.add('open');}
function closeAdminModal(){document.getElementById('adminModal').classList.remove('open');pinEntry='';updatePinUI();}
function updatePinUI(){for(let i=0;i<4;i++)document.getElementById('dot'+i).classList.toggle('filled',i<pinEntry.length);}
function pinKey(d){if(pinEntry.length>=4)return;pinEntry+=d;updatePinUI();if(pinEntry.length===4)setTimeout(checkPin,120);}
function pinDel(){pinEntry=pinEntry.slice(0,-1);updatePinUI();document.getElementById('pinError').textContent='';}
function checkPin(){if(pinEntry===ADMIN_PIN){closeAdminModal();window.location.href='./admin.html';}else{document.getElementById('pinError').textContent='Incorrect PIN — try again';pinEntry='';updatePinUI();}}
document.getElementById('adminModal').addEventListener('click',function(e){if(e.target===this)closeAdminModal();});
</script>
