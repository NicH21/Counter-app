<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Team</title>
</head>

<body style="font-family: Arial; text-align:center; margin-top:80px">

<h1>Choose Your Team</h1>

<button id="teamA" onclick="choose('teamA')" style="font-size:20px; margin:10px;">
  Team A

</button>

<button id="teamB" onclick="choose('teamB')" style="font-size:20px; margin:10px;">
  Team B
 
</button>

<button id="teamC" onclick="choose('teamC')" style="font-size:20px; margin:10px;">
  Team C
 
</button>

<script>

const url = "https://counterapp-5297b-default-rtdb.firebaseio.com/selectedTeams";

// choose team + lock it in Firebase
async function choose(team) {

    // mark team as taken in Firebase (GLOBAL for all devices)
    await fetch(url + "/" + team + ".json", {
        method: "PUT",
        body: JSON.stringify(true)
    });

    window.location.href = "./teams.html";
}

// load team availability from Firebase
async function loadTeams() {

    let res = await fetch(url + ".json");
    let data = await res.json();

    if (!data) return;

    if (data.teamA === true) {
        document.getElementById("teamA").disabled = true;
        document.getElementById("teamA").innerText = "Team A (Taken)";
    }

    if (data.teamB === true) {
        document.getElementById("teamB").disabled = true;
        document.getElementById("teamB").innerText = "Team B (Taken)";
    }

    if (data.teamC === true) {
        document.getElementById("teamC").disabled = true;
        document.getElementById("teamC").innerText = "Team C (Taken)";
    }
}

loadTeams();

</script>

</body>
</html>
