<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:100px">

<h1>Live Counter</h1>

<button onclick="increment()" style="font-size:40px;padding:20px">
  +1
</button>

<h2 id="count">0</h2>

<script>
const url = "https://counterapp-5297b-default-rtdb.firebaseio.com/counter.json";

// load value
async function load() {
    let res = await fetch(url);
    let value = await res.json();
    document.getElementById("count").innerText = value;
}

// increment
async function increment() {
    let res = await fetch(url);
    let value = await res.json();

    value = (value || 0) + 1;

    await fetch(url, {
        method: "PUT",
        body: JSON.stringify(value)
    });

    document.getElementById("count").innerText = value;
}

load();
</script>

</body>
</html>
