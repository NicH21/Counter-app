<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Counter</title>
</head>

<body style="font-family: Arial; text-align:center; margin-top:50px">

<h1>Team Control Panel</h1>

<!-- Buttons -->
<button onclick="update('teamA')" style="font-size:20px; margin:10px;">
  Team A +1
</button>

<button onclick="update('teamB')" style="font-size:20px; margin:10px;">
  Team B +1
</button>

<button onclick="update('teamC')" style="font-size:20px; margin:10px;">
  Team C +1
</button>

<hr>

<!-- Display -->
<h2 id="teamA">Team A: 0</h2>
<h2 id="teamB">Team B: 0</h2>
<h2 id="teamC">Team C: 0</h2>

<script>
const url = "https://counterapp-5297b-default-rtdb.firebaseio.com/teams.json";

// update team score
async function update(team) {
    let res = await fetch(url);
    let data = await res.json();

    if (!data) data = {};

    if (!data[team]) data[team] = 0;

    data[team]++;

    await fetch(url, {
        method: "PUT",
        body: JSON.stringify(data)
    });

    load(); // refresh display instantly
}

// load all values
async function load() {
    let res = await fetch(url);
    let data = await res.json();

    if (!data) return;

    document.getElementById("teamA").innerText = "Team A: " + (data.teamA || 0);
    document.getElementById("teamB").innerText = "Team B: " + (data.teamB || 0);
    document.getElementById("teamC").innerText = "Team C: " + (data.teamC || 0);
}

setInterval(load, 1000);
load();
</script>

</body>
</html>
